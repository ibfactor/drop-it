<!DOCTYPE html>
<html>
	<head>
		<title>DropIt</title>

		<link rel="stylesheet" href="/styles.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" integrity="sha512-PgQMlq+nqFLV4ylk1gwUOgm6CtIIXkKwaIHp/PAIWHzig/lKZSEGKEysh0TCVbHJXCLN7WetD8TFecIky75ZfQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	</head>
	<body>

		<main>
			<h1>Drop<span style="color:rgba(29, 104, 224);">It</span></h1>

			<label for="main_file">
				<span>
					<span>Drag & Drop or Click Here</span>
					<span>supports URLs, JSON, PNG, JPEG, GIF, MP4, MP3, TXT</span>
				</span>
			</label>
			<input type="file" id="main_file">

			<textarea placeholder="or paste something here"></textarea>

			<p>no file leaves your device unless you choose to store it in your drive</p>
		</main>

		<main id="view2">
			<span id="loader"></span>
			<pre id="input_t"></pre>
			<div class="actions">
				<button>Minify<i class="fas fa-compress-arrows-alt sm"></i></button>
				<button>Prettify<i class="fas fa-magic sm"></i></button>
				<button>Convert<i class="fas fa-chevron-right sm"></i></button>
				<button><i class="fas fa-upload"></i></button>
				<button><i class="fas fa-qrcode"></i></button>
			</div>
		</main>

		<script src="/script.js"></script>
	</body>
</html>
